name: Isolated database validation

on:
  push:
    branches:
      - security/multi-tenant-rbac
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-5f-d1-database-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Batch 5F-D1 isolated validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out implementation SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "GitHub event SHA: ${GITHUB_SHA}"
          echo "Checked-out SHA: ${checked_out_sha}"
          if [[ "${checked_out_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Refusing to validate a checkout that does not match the triggering SHA."
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Set up Supabase CLI 2.116.0
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify isolated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          supabase --version
          docker --version
          if [[ -f supabase/.temp/project-ref ]]; then
            echo "Refusing to run with a linked Supabase project."
            exit 1
          fi
          for variable in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_URL \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_URL; do
            if [[ -n "${!variable:-}" ]]; then
              echo "Refusing to run while ${variable} is configured."
              exit 1
            fi
          done

      - name: Stage repository migrations for ordered bootstrap
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_store="${RUNNER_TEMP}/purplelok-migrations"
          mkdir -p "${migration_store}"
          expected=(
            20260728110005_create_crm_schema.sql
            20260728111045_seed_demo_data.sql
            20260828120000_batch_1_identity_rbac_foundation.sql
            20260828150000_batch_3b_tenant_ownership_foundation.sql
            20260828170000_batch_4_active_organization_context.sql
            20260829100000_batch_5a_tenant_data_foundation.sql
            20260831120000_batch_5e_b2r_profile_authority.sql
            20260902120000_batch_5f_c1_auth_session_gate.sql
            20260903120000_batch_5f_d1_authorization_foundation.sql
          )

          mapfile -t actual < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            echo "Migration inventory differs from the approved nine-file Batch 5F-D1 sequence."
            printf 'Expected: %s\n' "${expected[@]}"
            printf 'Actual: %s\n' "${actual[@]}"
            exit 1
          fi

          for migration in "${expected[@]}"; do
            mv "supabase/migrations/${migration}" "${migration_store}/${migration}"
          done
          echo "store=${migration_store}" >> "${GITHUB_OUTPUT}"

      - name: Start disposable local Supabase database
        run: supabase db start

      - name: Resolve local database container
        id: database
        shell: bash
        run: |
          set -euo pipefail
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_purplelok-crm$')"
          if [[ -z "${database_container}" ]]; then
            echo "The expected disposable Supabase database container is not running."
            exit 1
          fi
          echo "container=${database_container}" >> "${GITHUB_OUTPUT}"

      - name: Apply core CRM schema migration
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260728110005_create_crm_schema.sql" supabase/migrations/
          supabase migration up --local

      - name: Bootstrap test-only Auth identities
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ steps.database.outputs.container }}" \
            psql -X --set ON_ERROR_STOP=1 --username postgres --dbname postgres \
            < supabase/tests/setup/batch_5a_ci_auth_bootstrap.psql

      - name: Apply demo seed and Batch 1
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260728111045_seed_demo_data.sql" supabase/migrations/
          cp "${{ steps.migrations.outputs.store }}/20260828120000_batch_1_identity_rbac_foundation.sql" supabase/migrations/
          supabase migration up --local

      - name: Test Batch 1 at its deployment stage
        run: supabase test db --local supabase/tests/database/batch_1_identity_rbac_foundation.test.sql

      - name: Bootstrap test-only organization state
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ steps.database.outputs.container }}" \
            psql -X --set ON_ERROR_STOP=1 --username postgres --dbname postgres \
            < supabase/tests/setup/batch_5a_ci_tenant_bootstrap.psql

      - name: Apply and test Batch 3B
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260828150000_batch_3b_tenant_ownership_foundation.sql" supabase/migrations/
          supabase migration up --local
          supabase test db --local supabase/tests/database/batch_3b_tenant_ownership_foundation.test.sql

      - name: Apply and test Batch 4
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260828170000_batch_4_active_organization_context.sql" supabase/migrations/
          supabase migration up --local
          supabase test db --local supabase/tests/database/batch_4_active_organization_context.test.sql

      - name: Apply Batch 5A
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260829100000_batch_5a_tenant_data_foundation.sql" supabase/migrations/
          supabase migration up --local

      - name: Verify pgTAP is available
        shell: bash
        run: |
          set -euo pipefail
          available="$(docker exec "${{ steps.database.outputs.container }}" \
            psql -X --tuples-only --no-align --username postgres --dbname postgres \
            --command "SELECT count(*) FROM pg_available_extensions WHERE name = 'pgtap';")"
          if [[ "${available}" != "1" ]]; then
            echo "pgTAP is not available in the disposable database."
            exit 1
          fi

      - name: Test Batch 5A
        run: supabase test db --local supabase/tests/database/batch_5a_tenant_data_foundation.test.sql

      - name: Apply and test Batch 5E-B2R profile authority
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260831120000_batch_5e_b2r_profile_authority.sql" supabase/migrations/
          supabase migration up --local
          supabase test db --local supabase/tests/database/batch_5e_b2r_profile_authority.test.sql

      - name: Apply and test Batch 5F-C1 Auth session gate
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260902120000_batch_5f_c1_auth_session_gate.sql" supabase/migrations/
          supabase migration up --local
          supabase test db --local supabase/tests/database/batch_5f_c1_auth_session_gate.test.sql

      - name: Apply and test Batch 5F-D1 authorization foundation
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.migrations.outputs.store }}/20260903120000_batch_5f_d1_authorization_foundation.sql" supabase/migrations/
          supabase migration up --local
          supabase test db --local supabase/tests/database/batch_5f_d1_authorization_foundation.test.sql

      - name: Validate frontend and scripts under Node 22
        shell: bash
        run: |
          set -euo pipefail
          npm run test:frontend
          npm run typecheck
          mapfile -t changed_typescript < <(
            git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.ts' '*.tsx'
          )
          if [[ ${#changed_typescript[@]} -gt 0 ]]; then
            node node_modules/eslint/bin/eslint.js "${changed_typescript[@]}"
          fi
          npm run check:tenant-queries
          npm run build

      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup

  recovery-session-gate-proof:
    name: Batch 5F-C1 disposable Auth lifecycle proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@v4

      - name: Verify isolated checkout and production guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(sed -n 's/^project_id = "\([^\"]*\)"/\1/p' supabase/config.toml)" == "purplelok-crm" ]]
          if [[ -f supabase/.temp/project-ref ]]; then
            echo "Refusing to run from a linked Supabase checkout."
            exit 1
          fi
          for variable in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_URL \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF \
            SUPABASE_SERVICE_ROLE_KEY \
            SUPABASE_URL; do
            if [[ -n "${!variable:-}" ]]; then
              echo "Refusing to run while ${variable} is configured."
              exit 1
            fi
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Set up Supabase CLI 2.116.0
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Enable disposable custom access token hook
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/# \[auth\.hook\.custom_access_token\]\n# enabled = true\n# uri = "pg-functions:\/\/<database>\/<schema>\/<hook_name>"/[auth.hook.custom_access_token]\nenabled = true\nuri = "pg-functions:\/\/postgres\/private\/batch_5f_c1_observing_hook"/' supabase/config.toml
          grep -Fq '[auth.hook.custom_access_token]' supabase/config.toml
          grep -Fq 'uri = "pg-functions://postgres/private/batch_5f_c1_observing_hook"' supabase/config.toml

      - name: Isolate production migrations from the disposable Auth proof
        id: isolate-migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_store="${RUNNER_TEMP}/batch-5f-c1-prior-migrations"
          mkdir -p "${migration_store}"
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          [[ "${#migrations[@]}" -gt 0 ]]
          for migration in "${migrations[@]}"; do
            if [[ "$(basename "${migration}")" != "20260902120000_batch_5f_c1_auth_session_gate.sql" ]]; then
              mv "${migration}" "${migration_store}/"
            fi
          done
          mapfile -t remaining < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          [[ "${remaining[*]}" == "20260902120000_batch_5f_c1_auth_session_gate.sql" ]]
          echo "migration_store=${migration_store}" >> "${GITHUB_OUTPUT}"

      - name: Start complete disposable Supabase stack
        run: supabase start

      - name: Run genuine Auth recovery lifecycle proof
        shell: bash
        env:
          EXPECTED_AUTH_VERSION: v2.196.0
          EXPECTED_POSTGRES_VERSION_PREFIX: "17.6"
          EXPECTED_SUPABASE_JS_VERSION: 2.57.4
          EXPECTED_AUTH_JS_VERSION: 2.71.1
        run: |
          set -euo pipefail
          set -a
          source <(supabase status -o env)
          set +a
          node --import tsx scripts/recovery-session-gate-proof.ts

      - name: Restore production migrations
        if: always() && steps.isolate-migrations.outcome == 'success'
        shell: bash
        env:
          MIGRATION_STORE: ${{ steps.isolate-migrations.outputs.migration_store }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=("${MIGRATION_STORE}"/*.sql)
          [[ "${#migrations[@]}" -gt 0 ]]
          mv "${migrations[@]}" supabase/migrations/

      - name: Prove production migrations were not changed
        if: always() && steps.isolate-migrations.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- supabase/migrations

      - name: Stop and destroy disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
